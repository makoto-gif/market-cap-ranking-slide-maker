name: 時価総額データの自動更新

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 6:00 JST
  workflow_dispatch:        # 手動実行も可能

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 最新データを取得
        run: node scripts/update-data.mjs

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/baseline.json data/history.json data/history-daily.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "時価総額データを自動更新 ($(date -u +%Y-%m-%d))"
            git push
          fi
